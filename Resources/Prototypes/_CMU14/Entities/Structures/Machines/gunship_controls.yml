- type: entity
  parent: CMComputerDropship
  id: CMUComputerGunshipControls
  name: Gunship Controls
  description: A unified control console for dropship navigation and weapon systems.
  components:
  - type: Sprite
    sprite: _CMU14/Structures/Machines/gunship_controls.rsi
    state: gunship_console
  - type: GunshipControls
  - type: DropshipNavigationComputer
    canTacticalLand: true
    tacticalLandFootprintOverride: 9, 15
  - type: DropshipTerminalWeapons
  - type: WhitelistedShuttle
    faction: govfor
    ShuttleType: Dropship
  - type: TacticalMapComputer
    faction: govfor
  - type: ActivatableUI
    key: enum.GunshipControlsUiKey.Key
  - type: AccessReader
    access: [ [ "AU14AccessGovforFTL" ], [ "AU14AccessGovforPilot" ] ]
  - type: ActivatableUIRequiresAccess
  - type: RequiresSkill
    skills:
      RMCSkillPilot: 1
  - type: UserInterface
    interfaces:
      enum.GunshipControlsUiKey.Key:
        type: GunshipControlsBui
      enum.DropshipNavigationUiKey.Key:
        type: DropshipNavigationBui
      enum.DropshipHijackerUiKey.Key:
        type: DropshipHijackerBui
      enum.DropshipTerminalWeaponsUi.Key:
        type: DropshipWeaponsBui
