# ├──[ Aegis | Warhead ]─────────────────────────────────────────────┤
- type: entity
  parent: RMCCrateSupply
  id: CMUCrateAegisLobby
  name: AEGIS tracking equipment crate (x3 pinpointers, x1 pamphlet)
  description: A supply crate containing AEGIS ID tracking equipment and documentation.
  components:
  - type: StorageFill
    contents:
    - id: CMUPinpointerAegisID
      amount: 3
    - id: CMPamphletPowerloader
      amount: 1

# Auth Key - Pinpointer
- type: entity
  parent: RMCPinpointerBase
  id: CMUPinpointerAegisID
  suffix: AEGIS
  components:
  - type: Pinpointer
    component: AegisTrackable
    targetName: AEGIS ID card

# Authorization Keys
- type: entity
  id: CMUIDCardAegis
  name: AEGIS Access Badge
  suffix: CMU
  description: High-Level AEGIS Access Badge, granting access to many of their restricted areas and equipment. Required to unlock AEGIS crates.
  components:
  - type: WarpPoint
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/aegis.rsi
    state: keycard
    drawdepth: SmallObjects
  - type: Item
    size: Tiny
  - type: Clothing
    slots:
      - idcard
  - type: Clickable
  - type: InteractionOutline
  - type: Access
    groups:
      - CMAccessAegis
  - type: AegisTrackable
  - type: Corrodible
    isCorrodible: false

- type: entity
  parent: CMUIDCardAegis
  id: CMUIDCardAegisIntel
  name: AEGIS Access Badge
  suffix: Intel-giving
  description: High-Level AEGIS Access Badge, granting access to many of their restricted areas and equipment. Required to unlock AEGIS crates. It has some blood on it.
  components:
  - type: IntelRescueSurvivorObjective # unused
    value: 2
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/aegis.rsi
    state: bloody

# Spawners
- type: entity
  parent: RMCAegisSpawner
  id: CMUAegisSpawner
  name: AEGIS abomb event crate random spawner
  suffix: CMU, Add to Warship/Planet

- type: entity
  parent: RMCAegisCorpseSpawner
  id: CMUAegisCorpseSpawner
  name: AEGIS corpse spawner - Scientist
  suffix: CMU, Id Unlocks AEGIS

# Warhead
- type: entity
  parent: RMCOrbitalCannonWarheadAegis
  id: CMUOrbitalCannonWarheadAegis
  description: "AEG-538-KRA, or KRAKEN, an experimental phoron-based orbital warhead, straight from the R&D Division of AEGIS. Designed to be used against targets where a single orbital warhead is simply not enough."
  name:  AEG-538-KRA
  components:
  - type: OrbitalCannonWarhead
    explosion: CMUOrbitalCannonExplosionAegis
    isAegis: true
    firstWarningRange: 60
    secondWarningRange: 55
    thirdWarningRange: 45
    intelPointsAwarded: 5

- type: entity
  parent: MarkerBase
  id: CMUOrbitalCannonExplosionAegis
  name: insane explosive Aegis OB explosion
  suffix: CMU, FIRES AN OB!!!
  components:
  - type: OrbitalCannonExplosion
    steps:
    - type: RMCOBXenoTunnel
      total: 50000
      slope: 3000
      max: 250
      delay: 0.5
      times: 3
      timesPer: 3
      spread: 5
      delayPer: 0.15
    - type: RMCOBXenoTunnel
      total: 250000
      slope: 25
      max: 150
      delay: 0.3
      times: 5
      timesPer: 4
      spread: 15
      delayPer: 0.2
    - type: RMCOBXenoTunnel
      total: 100000
      slope: 15
      max: 100
      delay: 0.4
      times: 4
      timesPer: 3
      spread: 25
      delayPer: 0.25
    - fire: RMCTileFireOBAegis
      fireRange: 60
  - type: WarpPoint
    location: 1 orbital bombardment
