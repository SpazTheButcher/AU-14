- type: entity
  id: CorporateSpy
  parent: BaseGameRule
  components:
  - type: GameRule
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ CorporateSpyRole ]
      max: 1
      playerRatio: 15
      jobBlacklistGroup:
      - AllGovforJobs
      - AllOpforJobs
      briefing:
        text: spy-role-greeting
        color: DarkSlateGray
        sound: "/Audio/Ambience/Antag/headrev_start.ogg"
      startingGear: AU14GearCorporateSpy
      components:
      - type: CorporateSpy
      mindRoles:
      - MindRoleCorporateSpy

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleCorporateSpy
  name: Corporate Spy Mind Role
  components:
  - type: MindRole
    antagPrototype: CorporateSpyRole
    exclusiveAntag: true
    roleType: SoloAntagonist

- type: antag
  parent: CMUAntagColonyBase
  id: CorporateSpyRole
  name: roles-antag-spy-name
  setPreference: true
  objective: roles-antag-spy-objective

- type: startingGear
  id: AU14GearCorporateSpy
  equipment:
    pocket1: AU14IDCardCorporateSpy
