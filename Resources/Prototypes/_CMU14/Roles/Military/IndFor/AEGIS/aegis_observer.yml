- type: job
  parent: CMUJobBaseAegis
  id: CMUJobAegisObserver
  name: cmu-job-name-aegis-observer
  description: cmu-job-description-aegis-observer
  startingGear: CMUGearAegisObserver
  roundComponents:
  - type: Skills
    skills:
      RMCSkillEndurance: 1
      RMCSkillFirearms: 1
      RMCSkillIntel: 3
      RMCSkillLeadership: 2
      RMCSkillResearch: 1
  - type: JobPrefix
    prefix: cmu-job-prefix-aegis-observer

- type: startingGear
  id: CMUGearAegisObserver
  equipment:
    jumpsuit: CMJumpsuitLiaisonIvy
    shoes: RMCShoesLaceup
    back: CMSatchel
    ears: AU14HeadsetGovforAuxiliary
    id: CMUIDCardAegisObserver

# ├──[ Spawnpoint ]──────────────────────────────────────────────────┤
- type: entity
  parent: CMSpawnPointJobBase
  id: CMUSpawnPointAegisObserver
  name: AEGIS observer spawn point
  suffix: RMC, Job Spawn
  components:
  - type: SpawnPoint
    job_id: CMUJobAegisObserver
  - type: Sprite
    state: x

# ├──[ Ghost Spawn ]─────────────────────────────────────────────────┤
- type: entity
  id: CMURandomHumanoidAegisObserver
  name: AEGIS observer
  suffix: Ghost
  components:
  - type: Sprite
    sprite: _RMC14/Objects/CMIDs/aegis.rsi
    state: keycard
  - type: RandomHumanoidSpawner
    settings: CMUSettingsAegisObserver

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: CMUSettingsAegisObserver
  components:
  - type: GhostRole
    name: cmu-ghost-name-aegis-observer
    description: cmu-ghost-role-information-aegis-observer-description
    rules: cmu-ghost-role-information-aegis-rules
    reregister: false
    job: CMUJobAegisObserver
    raffle:
      settings: short
  - type: GhostRoleApplySpecial
