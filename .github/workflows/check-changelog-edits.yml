name: Check Changelog Edits

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR for manual edits to the changelog files
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });

            const editsChangelog = files.some(f => f.filename === 'Resources/Changelog/CMU.yml');
            const editsParts = files.some(f => f.filename.startsWith('Resources/Changelog/Parts/'));
            if (!editsChangelog && !editsParts) return;

            let body = '';
            if (editsChangelog) {
              body += `It looks like this PR modifies \`Resources/Changelog/CMU.yml\`.\n\n` +
                `That file is generated automatically by the changelog bot from the \`:cl:\` section of PR descriptions, ` +
                `so manual edits will be overwritten on the next update.\n\n`;
            }
            if (editsParts) {
              body += `It looks like this PR adds or edits files in \`Resources/Changelog/Parts/\`.\n\n` +
                `Hand-written parts are picked up by \`Tools/update_changelog_parts.py\` and do work, ` +
                `but they are very discouraged: the \`:cl:\` section of the PR description is the normal ` +
                `method, and parts are extra work for no gain.\n\n`;
            }

            body += `Please make your changelog entries in the PR description instead:\n\n` +
              `\`\`\`\n:cl:\n- add: New feature added\n\`\`\`\n\n` +
              `If you already have a \`:cl:\` section, just remove the changelog file changes from this PR.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
